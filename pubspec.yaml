name: esep
description: ЭСЕП — Дүкөн эсеби
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icons.png"
  adaptive_icon_background: "#14532D"
  adaptive_icon_foreground: "assets/icon/icons.png"
